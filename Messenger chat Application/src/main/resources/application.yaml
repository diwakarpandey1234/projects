spring:
  application:
    name: messenger-application
  datasource:
     url: {DATABASE}
     driver-class-name: { DRIVER CLASS }
     username: { USERNAME }
     password: { PASSWORD }

  jpa:
     hibernate:
     ddl-auto: update
     show-sql: true

  h2:
   console:
    enabled: true

server:
  port: { PORT }