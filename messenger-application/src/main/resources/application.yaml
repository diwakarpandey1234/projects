spring:
  application:
    name: messenger-application
  datasource:
     url: jdbc:h2:mem:testdb
     driver-class-name: org.h2.Driver
     username: sa
     password: password

  jpa:
     hibernate:
     ddl-auto: update
     show-sql: true

  h2:
   console:
    enabled: true

app:
  jwt:
    secret: "mySuperSecretKeyForJwtTokenGeneration123456789"
    expiration-ms: 900000

server:
  port: 8081